<!DOCTYPE html>
<html lang="bn" translate="no">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="google" content="notranslate" />
  <meta name="description" content="খোঁজো — বাংলাদেশের স্থানীয় অনুসন্ধান ফলাফল" />
  <title>খোঁজো — অনুসন্ধান</title>

  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600&family=Inter:opsz,wght@14..32,300..600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/khujo.css?v=12" />
</head>

<body>
  <div class="page-container">

    <!-- ── STICKY SERP HEADER ───────────────────────────── -->
    <header class="serp-header">
      <div class="content-container">
        <div class="serp-header-inner">

          <!-- Brand (compact on mobile, full on sm+) -->
          <a href="/" class="brand-mark compact" aria-label="খোঁজো হোম" style="display:none;" id="brandCompact">
            <span class="brand-icon">
              <span class="brand-icon-ring"></span>
              <span class="brand-icon-dot"></span>
            </span>
          </a>
          <a href="/" class="brand-mark" aria-label="খোঁজো হোম" id="brandFull">
            <span class="brand-icon">
              <span class="brand-icon-ring"></span>
              <span class="brand-icon-dot"></span>
            </span>
            <span class="brand-text">
              <span class="brand-name latin">khujo</span>
            </span>
          </a>

          <!-- Search bar -->
          <div class="serp-search-wrap" style="flex:1;max-width:680px;">
            <form id="serpForm" role="search" action="/search" method="get">
              <div class="search-wrap" id="serpSearchWrap">
                <div class="search-field">
                  <div class="search-input-row">
                    <span class="search-icon" aria-hidden="true">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.35-4.35" />
                      </svg>
                    </span>
                    <input id="serpSearchInput" name="q" type="search" autocomplete="off" spellcheck="false"
                      placeholder="বাংলা, Banglish বা English-এ খুঁজুন" class="search-input" aria-label="খোঁজো সার্চ" />
                  </div>
                </div>
              </div>
            </form>
          </div>


        </div>
      </div>
    </header>

    <!-- ── TABS ─────────────────────────────────────────── -->
    <nav class="serp-tabs" aria-label="ফলাফলের ধরন">
      <div class="content-container">
        <div class="serp-tabs-inner">
          <button class="tab-btn active" aria-current="page">সব ফলাফল</button>
          <span class="tab-btn" data-tab="images">ছবি</span>
          <span class="tab-btn coming-soon" title="শীঘ্রই আসছে">খবর</span>
          <span class="tab-btn coming-soon" title="শীঘ্রই আসছে">সরকারি তথ্য</span>
        </div>
      </div>
    </nav>

    <!-- ── SERP BODY ─────────────────────────────────────── -->
    <main class="serp-body">
      <div class="content-container">
        <div class="serp-grid">

          <!-- Main column -->
          <section class="serp-main" aria-label="অনুসন্ধান ফলাফল">
            <p id="resultMeta" class="result-meta"></p>
            <div id="resultsList"></div>
          </section>

          <!-- Sidebar -->
          <aside class="serp-sidebar" aria-label="অতিরিক্ত তথ্য">

            <!-- Top Sources card -->
            <section id="sourcesCard" class="sources-card hidden" aria-label="শীর্ষ উৎস">
              <p class="card-label">শীর্ষ উৎস</p>
              <div id="sourcesList"></div>
            </section>

            <!-- Perspectives card -->
            <section id="perspectivesCard" class="sources-card hidden" aria-label="দৃষ্টিভঙ্গি">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
                <p class="card-label" style="margin-bottom:0;">দৃষ্টিভঙ্গি</p>
                <span
                  style="font-size:10px;padding:2px 8px;border-radius:9999px;background:var(--text-primary);color:var(--surface-0);font-weight:600;letter-spacing:0.05em;">Beta</span>
              </div>
              <div id="perspectivesList"></div>
            </section>

            <!-- Session history card -->
            <section id="sessionCard" class="sources-card hidden" aria-label="আপনার সেশন">
              <p class="card-label">আপনার সেশন</p>
              <div id="sessionList"></div>
            </section>

          </aside>
        </div>
      </div>
    </main>

    <!-- ── FOOTER ───────────────────────────────────────── -->
    <footer class="serp-footer">
      <div class="content-container">
        <div class="serp-footer-inner">
          <span>খোঁজো · বাংলাদেশের স্থানীয় তথ্য অনুসন্ধান</span>
          <div class="footer-links">
            <button type="button">গোপনীয়তা</button>
            <button type="button">শর্তাবলী</button>
            <button type="button">মতামত</button>
          </div>
        </div>
      </div>
    </footer>

  </div>

  <script src="/js/avro-lib.min.js"></script>
  <script type="module" src="/js/khujo.js?v=12"></script>
</body>

</html>
