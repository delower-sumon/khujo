<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khujo Admin — Entity Verification</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc; --card-bg: #ffffff; --card-border: #e2e8f0; --text-main: #0f172a; --text-secondary: #334155; --text-muted: #64748b;
      --brand-green: #006a4e; --green-text: #059669; --green-bg: #ecfdf5; --green-border: #a7f3d0;
      --red-text: #dc2626; --red-bg: #fef2f2; --red-border: #fecaca;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', 'Hind Siliguri', sans-serif; background: var(--bg); color: var(--text-main); padding: 20px 16px; line-height: 1.5; }
    .container { max-width: 1040px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--card-border); flex-wrap: wrap; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo { width: 40px; height: 40px; background: var(--brand-green); border-radius: 10px; display: grid; place-items: center; font-weight: 700; color: white; font-size: 20px; }
    h1 { font-size: 19px; font-weight: 700; }
    .subtitle { font-size: 13px; color: var(--text-muted); }
    .btn-refresh { background: var(--card-bg); color: var(--text-secondary); border: 1px solid var(--card-border); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 13px; box-shadow: var(--shadow-sm); display: inline-flex; align-items: center; gap: 6px; }
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--card-border); background: white; cursor: pointer; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .tab-btn.active { background: var(--text-main); color: white; border-color: var(--text-main); }
    .toolbar { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .search-filter { flex: 1; min-width: 200px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--card-border); outline: none; }
    .queue-list { display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; box-shadow: var(--shadow-sm); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .status-badge { font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: 600; text-transform: uppercase; }
    .status-candidate { background: #fef08a; color: #854d0e; }
    .status-verified { background: var(--green-bg); color: var(--green-text); }
    .status-rejected { background: var(--red-bg); color: var(--red-text); }
    .card-title { font-size: 16px; font-weight: 600; color: var(--text-main); margin-bottom: 4px; }
    .snippet-text { font-size: 13px; color: var(--text-secondary); }
    .edit-form { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; padding: 14px; margin: 14px 0; display: flex; flex-direction: column; gap: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
    .form-textarea { font-family: monospace; font-size: 13px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--card-border); min-height: 120px; resize: vertical; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .meta-time { font-size: 12px; color: var(--text-muted); }
    .card-actions { display: flex; gap: 8px; }
    .btn-approve { background: var(--green-bg); color: var(--green-text); border: 1px solid var(--green-border); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn-reject { background: var(--red-bg); color: var(--red-text); border: 1px solid var(--red-border); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .empty-state { text-align: center; padding: 50px 20px; background: var(--card-bg); border: 1px dashed var(--card-border); border-radius: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-logo">K</div>
        <div>
          <h1>Khujo Entity Curation</h1>
          <div class="subtitle">Human-in-the-Loop Knowledge Graph Editor</div>
        </div>
      </div>
      <div style="display: flex; gap: 10px;">
        <a href="/admin.html" class="btn-refresh" style="text-decoration:none; background: var(--green-bg); color: var(--green-text);">📄 Switch to Documents</a>
        <button class="btn-refresh" onclick="loadEntities()">↻ Refresh</button>
      </div>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-candidate" onclick="switchTab('candidate')">🟡 Pending Review</button>
      <button class="tab-btn" id="tab-verified" onclick="switchTab('verified')">🟢 Approved & Live</button>
      <button class="tab-btn" id="tab-rejected" onclick="switchTab('rejected')">🔴 Rejected</button>
    </div>

    <div class="toolbar">
      <input type="text" class="search-filter" id="filterInput" placeholder="Search entities..." oninput="renderQueue()">
    </div>

    <div id="queue" class="queue-list">Loading entities...</div>
  </div>

  <script>
    let currentTab = 'candidate';
    let entities = [];

    function esc(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    async function loadEntities() {
      const queueEl = document.getElementById('queue');
      queueEl.innerHTML = '<div class="empty-state">Loading entities...</div>';
      
      try {
        const res = await fetch(`http://localhost:8000/api/v1/admin/entities?status=${currentTab}`);
        if (!res.ok) throw new Error('Failed to load');
        entities = await res.json();
        renderQueue();
      } catch (err) {
        queueEl.innerHTML = `<div class="empty-state" style="color:var(--red-text)">Error loading entities: ${err.message}</div>`;
      }
    }

    function renderQueue() {
      const queueEl = document.getElementById('queue');
      const filter = document.getElementById('filterInput').value.toLowerCase();
      
      const filtered = entities.filter(d => 
        (d.name || '').toLowerCase().includes(filter) || 
        (d.summary || '').toLowerCase().includes(filter)
      );

      if (filtered.length === 0) {
        queueEl.innerHTML = `<div class="empty-state">Queue is empty</div>`;
        return;
      }

      queueEl.innerHTML = filtered.map(d => `
        <div class="card" id="card-${d.id}">
          <div class="card-header">
            <span class="status-badge status-${d.state}">${d.state}</span>
          </div>
          
          <div style="display:flex; gap: 16px;">
            ${d.image_url ? `<img src="${esc(d.image_url)}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px;">` : ''}
            <div>
              <div class="card-title">${esc(d.name)}</div>
              <div class="snippet-text">${esc(d.summary)}</div>
            </div>
          </div>

          <div class="edit-form">
            <div class="form-group">
              <label class="form-label">Quick Facts (JSON)</label>
              <textarea class="form-textarea" id="facts-${d.id}">${esc(JSON.stringify(d.facts, null, 2))}</textarea>
            </div>
            <div style="text-align: right;">
              <button class="btn-refresh" onclick="saveFacts('${d.id}')">💾 Save Facts</button>
            </div>
          </div>

          <div class="card-footer">
            <span class="meta-time">Created: ${new Date(d.created_at).toLocaleString()}</span>
            <div class="card-actions">
              ${currentTab === 'candidate' || currentTab === 'rejected' ? `<button class="btn-approve" onclick="actionEntity('${d.id}', 'verify')">✓ Approve</button>` : ''}
              ${currentTab === 'candidate' || currentTab === 'verified' ? `<button class="btn-reject" onclick="actionEntity('${d.id}', 'reject')">✕ Reject</button>` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    async function saveFacts(id) {
      const textarea = document.getElementById(`facts-${id}`);
      let factsObj;
      try {
        factsObj = JSON.parse(textarea.value);
      } catch (e) {
        alert("Invalid JSON format!");
        return;
      }
      
      try {
        const res = await fetch(`http://localhost:8000/api/v1/admin/entities/${id}/facts`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ facts: factsObj })
        });
        if (res.ok) alert('Facts updated!');
        else alert('Error updating facts');
      } catch (err) {
        alert(err.message);
      }
    }

    async function actionEntity(id, action) {
      try {
        const res = await fetch(`http://localhost:8000/api/v1/admin/entities/${id}/action?action=${action}`, { method: 'POST' });
        if (res.ok) {
          document.getElementById(`card-${id}`).style.display = 'none';
        }
      } catch (err) {
        alert(err.message);
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      currentTab = tab;
      loadEntities();
    }

    loadEntities();
  </script>
</body>
</html>
