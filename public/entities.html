<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khujo Admin — Entity & Alias Curation</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc; --card-bg: #ffffff; --card-border: #e2e8f0; --text-main: #0f172a; --text-secondary: #334155; --text-muted: #64748b;
      --brand-green: #006a4e; --green-text: #059669; --green-bg: #ecfdf5; --green-border: #a7f3d0;
      --red-text: #dc2626; --red-bg: #fef2f2; --red-border: #fecaca;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', 'Hind Siliguri', sans-serif; background: var(--bg); color: var(--text-main); padding: 20px 16px; line-height: 1.5; }
    .container { max-width: 1040px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--card-border); flex-wrap: wrap; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo { width: 40px; height: 40px; background: var(--brand-green); border-radius: 10px; display: grid; place-items: center; font-weight: 700; color: white; font-size: 20px; }
    h1 { font-size: 19px; font-weight: 700; }
    .subtitle { font-size: 13px; color: var(--text-muted); }
    .btn-refresh { background: var(--card-bg); color: var(--text-secondary); border: 1px solid var(--card-border); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 13px; box-shadow: var(--shadow-sm); display: inline-flex; align-items: center; gap: 6px; }
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--card-border); background: white; cursor: pointer; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .tab-btn.active { background: var(--text-main); color: white; border-color: var(--text-main); }
    .toolbar { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .search-filter { flex: 1; min-width: 200px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--card-border); outline: none; }
    .queue-list { display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; box-shadow: var(--shadow-sm); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .status-badge { font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: 600; text-transform: uppercase; }
    .status-candidate { background: #fef08a; color: #854d0e; }
    .status-verified { background: var(--green-bg); color: var(--green-text); }
    .status-rejected { background: var(--red-bg); color: var(--red-text); }
    .card-title { font-size: 16px; font-weight: 600; color: var(--text-main); margin-bottom: 4px; }
    .snippet-text { font-size: 13px; color: var(--text-secondary); }
    .edit-form { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; padding: 14px; margin: 14px 0; display: flex; flex-direction: column; gap: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
    .form-input { font-size: 13px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--card-border); outline: none; }
    .form-textarea { font-family: monospace; font-size: 13px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--card-border); min-height: 120px; resize: vertical; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .meta-time { font-size: 12px; color: var(--text-muted); }
    .card-actions { display: flex; gap: 8px; }
    .btn-approve { background: var(--green-bg); color: var(--green-text); border: 1px solid var(--green-border); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn-reject { background: var(--red-bg); color: var(--red-text); border: 1px solid var(--red-border); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .empty-state { text-align: center; padding: 50px 20px; background: var(--card-bg); border: 1px dashed var(--card-border); border-radius: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-logo">K</div>
        <div>
          <h1>Khujo Curation Engine</h1>
          <div class="subtitle">Human-in-the-Loop Entities & Aliases Verification</div>
        </div>
      </div>
      <div style="display: flex; gap: 10px;">
        <a href="/admin.html" class="btn-refresh" style="text-decoration:none; background: var(--green-bg); color: var(--green-text);">📄 Documents Admin</a>
        <button class="btn-refresh" onclick="refreshCurrentTab()">↻ Refresh</button>
      </div>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-candidate" onclick="switchTab('candidate')">🟡 Pending Entities</button>
      <button class="tab-btn" id="tab-verified" onclick="switchTab('verified')">🟢 Approved Entities</button>
      <button class="tab-btn" id="tab-alias-candidate" onclick="switchTab('alias-candidate')">🏷️ Pending Aliases</button>
      <button class="tab-btn" id="tab-alias-verified" onclick="switchTab('alias-verified')">🏷️ Active Aliases Listing</button>
    </div>

    <div class="toolbar">
      <input type="text" class="search-filter" id="filterInput" placeholder="Search entities or aliases..." oninput="renderCurrent()">
    </div>

    <div id="queue" class="queue-list">Loading data...</div>
  </div>

  <script>
    let currentTab = 'candidate';
    let entities = [];
    let aliases = [];

    function esc(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`tab-${tab}`);
      if (activeBtn) activeBtn.classList.add('active');

      if (tab.startsWith('alias-')) {
        loadAliases();
      } else {
        loadEntities();
      }
    }

    function refreshCurrentTab() {
      switchTab(currentTab);
    }

    async function loadEntities() {
      const queueEl = document.getElementById('queue');
      queueEl.innerHTML = '<div class="empty-state">Loading entities...</div>';
      
      try {
        const res = await fetch(`http://localhost:8000/api/v1/admin/entities?status=${currentTab}`);
        if (!res.ok) throw new Error('Failed to load');
        entities = await res.json();
        renderEntities();
      } catch (err) {
        queueEl.innerHTML = `<div class="empty-state" style="color:var(--red-text)">Error loading entities: ${err.message}</div>`;
      }
    }

    async function loadAliases() {
      const queueEl = document.getElementById('queue');
      queueEl.innerHTML = '<div class="empty-state">Loading aliases...</div>';
      const status = currentTab === 'alias-candidate' ? 'candidate' : 'verified';
      
      try {
        const res = await fetch(`http://localhost:8000/api/v1/admin/aliases?status=${status}`);
        if (!res.ok) throw new Error('Failed to load aliases');
        aliases = await res.json();
        renderAliases();
      } catch (err) {
        queueEl.innerHTML = `<div class="empty-state" style="color:var(--red-text)">Error loading aliases: ${err.message}</div>`;
      }
    }

    function renderCurrent() {
      if (currentTab.startsWith('alias-')) {
        renderAliases();
      } else {
        renderEntities();
      }
    }

    function renderEntities() {
      const queueEl = document.getElementById('queue');
      const filter = document.getElementById('filterInput').value.toLowerCase();
      
      const filtered = entities.filter(d => 
        (d.name || '').toLowerCase().includes(filter) || 
        (d.summary || '').toLowerCase().includes(filter)
      );

      if (filtered.length === 0) {
        queueEl.innerHTML = `<div class="empty-state">No entities found</div>`;
        return;
      }

      queueEl.innerHTML = filtered.map(d => `
        <div class="card" id="card-${d.id}">
          <div class="card-header">
            <span class="status-badge status-${d.state}">${d.state}</span>
          </div>
          
          <div style="display:flex; gap: 16px;">
            ${d.image_url ? `<img src="${esc(d.image_url)}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px;">` : ''}
            <div>
              <div class="card-title">${esc(d.name)}</div>
              <div class="snippet-text">${esc(d.summary)}</div>
            </div>
          </div>

          <div class="edit-form">
            <div class="form-group">
              <label class="form-label">Quick Facts (JSON)</label>
              <textarea class="form-textarea" id="facts-${d.id}">${esc(JSON.stringify(d.facts, null, 2))}</textarea>
            </div>
            <div style="text-align: right;">
              <button class="btn-refresh" onclick="saveFacts('${d.id}')">💾 Save Facts</button>
            </div>
          </div>

          <div class="card-footer">
            <div class="meta-time">Created: ${d.created_at}</div>
            <div class="card-actions">
              ${d.state !== 'verified' ? `<button class="btn-approve" onclick="actionEntity('${d.id}', 'approve')">✓ Approve Entity</button>` : ''}
              ${d.state !== 'rejected' ? `<button class="btn-reject" onclick="actionEntity('${d.id}', 'reject')">✕ Reject Entity</button>` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderAliases() {
      const queueEl = document.getElementById('queue');
      const filter = document.getElementById('filterInput').value.toLowerCase();
      
      const filtered = aliases.filter(a => 
        (a.name || '').toLowerCase().includes(filter) || 
        (a.entity_display_name || '').toLowerCase().includes(filter)
      );

      if (filtered.length === 0) {
        queueEl.innerHTML = `<div class="empty-state">No aliases found</div>`;
        return;
      }

      queueEl.innerHTML = filtered.map(a => `
        <div class="card" id="alias-card-${a.entity_name_id}">
          <div class="card-header">
            <div>
              <span class="status-badge status-${a.state}">${a.state}</span>
              <span style="font-size:12px; color:var(--text-muted); margin-left:8px;">Kind: ${a.name_kind} | Script: ${a.script}</span>
            </div>
            <div style="font-size:13px; font-weight:600; color:var(--brand-green);">
              Entity: ${esc(a.entity_display_name)}
            </div>
          </div>
          
          <div class="edit-form" style="margin: 8px 0;">
            <div class="form-group">
              <label class="form-label">Alias String (English / Banglish / Transliteration)</label>
              <input type="text" class="form-input" id="alias-input-${a.entity_name_id}" value="${esc(a.name)}">
            </div>
          </div>

          <div class="card-footer">
            <div class="meta-time">ID: ${a.entity_name_id.slice(0, 8)}...</div>
            <div class="card-actions">
              <button class="btn-refresh" onclick="updateAlias('${a.entity_name_id}')">💾 Save Edit</button>
              ${a.state !== 'verified' ? `<button class="btn-approve" onclick="verifyAlias('${a.entity_name_id}', 'approve')">✓ Approve Alias</button>` : ''}
              <button class="btn-reject" onclick="verifyAlias('${a.entity_name_id}', 'reject')">✕ Delete Alias</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function actionEntity(id, action) {
      try {
        const res = await fetch(`http://localhost:8000/api/v1/admin/entities/${id}/action?action=${action}`, { method: 'POST' });
        if (!res.ok) throw new Error('Action failed');
        loadEntities();
      } catch (err) {
        alert(err.message);
      }
    }

    async function saveFacts(id) {
      const textarea = document.getElementById(`facts-${id}`);
      try {
        const json = JSON.parse(textarea.value);
        const res = await fetch(`http://localhost:8000/api/v1/admin/entities/${id}/facts`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ facts: json })
        });
        if (!res.ok) throw new Error('Failed to update facts');
        alert('Facts updated successfully!');
      } catch (err) {
        alert('Invalid JSON: ' + err.message);
      }
    }

    async function verifyAlias(id, action) {
      try {
        const res = await fetch(`http://localhost:8000/api/v1/admin/aliases/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ entity_name_id: id, action: action })
        });
        if (!res.ok) throw new Error('Action failed');
        loadAliases();
      } catch (err) {
        alert(err.message);
      }
    }

    async function updateAlias(id) {
      const input = document.getElementById(`alias-input-${id}`);
      const val = input ? input.value.trim() : '';
      if (!val) return alert('Alias name cannot be empty');
      try {
        const res = await fetch(`http://localhost:8000/api/v1/admin/aliases/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ entity_name_id: id, action: 'update', name: val })
        });
        if (!res.ok) throw new Error('Update failed');
        alert('Alias updated and verified successfully!');
        loadAliases();
      } catch (err) {
        alert(err.message);
      }
    }

    loadEntities();
  </script>
</body>
</html>
