<!DOCTYPE html>
<html lang="bn" translate="no">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="google" content="notranslate" />
  <meta name="description"
    content="খোঁজো — বাংলাদেশের স্থানীয় অনুসন্ধান। বাংলা, Banglish ও English-এ নির্ভরযোগ্য স্থানীয় উৎস খুঁজুন।" />
  <title>খোঁজো — বাংলাদেশের স্থানীয় অনুসন্ধান</title>

  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600&family=Inter:opsz,wght@14..32,300..600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/khujo.css?v=41" />
</head>

<body>
  <div class="page-container landing-bg">

    <!-- ── HEADER ──────────────────────────────────────── -->
    <header>
      <div class="content-container">
        <div class="landing-header">
          <a href="/" class="brand-mark" aria-label="খোঁজো হোম">
            <span class="brand-icon">
              <img src="/logo.svg" alt="Khujo Logo" class="brand-logo-img" />
            </span>
            <span class="brand-text">
              <span class="brand-name latin">khujo</span>
            </span>
          </a>

          <!-- Right side: Beta badge -->
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <span class="for-bd-badge">বেটা সংস্করণ</span>
          </div>
        </div>
      </div>
    </header>

    <!-- ── MAIN ────────────────────────────────────────── -->
    <main class="landing-main">
      <div class="content-container" style="display:flex;flex-direction:column;align-items:center;">

        <!-- Hero text -->
        <div class="hero-text">
          <h1 class="hero-title">খোঁজো</h1>
          <!-- Secondary tagline -->
          <span class="hero-tagline-secondary">বাংলাদেশের নিজস্ব অনুসন্ধান</span>
        </div>


        <!-- Search bar -->
        <div class="search-wrap-landing">
          <form id="landingForm" role="search" action="/search" method="get">
            <div class="search-wrap" id="landingSearchWrap">
              <div class="search-field">
                <div class="search-input-row">
                  <span class="search-icon homepage-logo-icon" aria-hidden="true">
                    <img src="/logo.svg" alt="Khujo Logo" />
                  </span>
                  <input id="landingSearchInput" name="q" type="search" autocomplete="off" spellcheck="false"
                    placeholder="বাংলা, Banglish বা English-এ খুঁজুন" class="search-input" aria-label="খোঁজো সার্চ"
                    autofocus />
                </div>
              </div>
            </div>
          </form>
        </div>

        <!-- Trending chips -->
        <div class="trending-section" aria-label="ট্রেন্ডিং অনুসন্ধান">
          <span class="trending-label">ট্রেন্ডিং:</span>
          <button class="trend-chip" data-query="ঢাকা আবহাওয়া">ঢাকা আবহাওয়া</button>
          <button class="trend-chip" data-query="পদ্মা সেতু">পদ্মা সেতু</button>
          <button class="trend-chip" data-query="বাংলাদেশ ক্রিকেট">বাংলাদেশ ক্রিকেট</button>
          <button class="trend-chip" data-query="ঢাকা বিশ্ববিদ্যালয়">ঢাকা বিশ্ববিদ্যালয়</button>
          <button class="trend-chip" data-query="চট্টগ্রাম বন্দর">চট্টগ্রাম বন্দর</button>
        </div>

        <p class="hero-sub" style="margin-top: 40px;">
          বাংলায় স্থানীয় তথ্য অনুসন্ধান
        </p>
        <!-- Bangla + English date display -->
        <div id="banglaDateDisplay" class="home-date-display" aria-label="আজকের তারিখ"></div>

      </div>
    </main>

    <!-- ── FOOTER ───────────────────────────────────────── -->
    <footer>
      <div class="content-container">
        <div class="landing-footer">
          <span>বাংলাদেশ</span>
          <span>খোঁজো একটি স্থানীয় জ্ঞানভিত্তিক অনুসন্ধান প্রকল্প</span>

        </div>
      </div>
    </footer>

  </div>

  <script src="/js/avro-lib.min.js"></script>
  <script type="module" src="/js/khujo.js?v=3"></script>
</body>

</html>
