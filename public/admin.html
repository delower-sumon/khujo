<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khujo Admin — Data Verification Queue</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --green: #10b981;
      --green-bg: rgba(16, 185, 129, 0.15);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.15);
      --yellow: #f59e0b;
      --yellow-bg: rgba(245, 158, 11, 0.15);
      --blue: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Hind Siliguri', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 24px;
      line-height: 1.5;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      width: 36px; height: 36px;
      background: #006a4e;
      border-radius: 8px;
      display: grid; place-items: center;
      font-weight: 700; color: white; font-size: 18px;
    }
    h1 { font-size: 20px; font-weight: 600; }
    .subtitle { font-size: 13px; color: var(--text-muted); }

    .btn-refresh {
      background: var(--card-border);
      color: var(--text-main);
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      transition: background 0.2s;
    }
    .btn-refresh:hover { background: #475569; }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    .stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .stat-val { font-size: 24px; font-weight: 700; margin-top: 4px; }
    .stat-pending { color: var(--yellow); }
    .stat-verified { color: var(--green); }
    .stat-rejected { color: var(--red); }
    .stat-db { color: var(--blue); }

    /* Toolbar */
    .toolbar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .batch-actions { display: flex; gap: 8px; align-items: center; }
    
    button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .btn-approve { background: #006a4e; color: white; }
    .btn-approve:hover:not(:disabled) { opacity: 0.9; }
    
    .btn-reject { background: #dc2626; color: white; }
    .btn-reject:hover:not(:disabled) { opacity: 0.9; }

    .checkbox-label {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }

    .search-filter {
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      width: 220px;
      outline: none;
    }
    .search-filter:focus { border-color: var(--blue); }

    /* Candidate Cards */
    .queue-list { display: flex; flex-direction: column; gap: 14px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 18px;
      transition: border-color 0.2s;
    }
    .card.selected { border-color: var(--blue); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .title-area { display: flex; align-items: center; gap: 10px; flex: 1; }
    .card-checkbox { width: 16px; height: 16px; cursor: pointer; }
    
    .favicon-icon {
      width: 18px; height: 18px;
      border-radius: 4px;
      object-fit: contain;
      background: #334155;
    }

    .doc-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      text-decoration: none;
      line-height: 1.3;
    }
    .doc-title:hover { text-decoration: underline; color: #60a5fa; }

    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-kind { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }

    .url-link {
      font-size: 12px;
      color: #38bdf8;
      text-decoration: none;
      word-break: break-all;
      display: inline-block;
      margin-bottom: 10px;
    }

    .doc-body {
      font-size: 13px;
      color: var(--text-muted);
      background: rgba(15, 23, 42, 0.6);
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 120px;
      overflow-y: auto;
      border: 1px solid #1e293b;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .meta-time { font-size: 11px; color: #64748b; }

    .card-actions { display: flex; gap: 8px; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: 10px;
    }
    .empty-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: var(--green); }
    .empty-desc { font-size: 13px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-logo">K</div>
        <div>
          <h1>Khujo Data Verification Vault</h1>
          <div class="subtitle">Human-in-the-Loop Content Gatekeeper</div>
        </div>
      </div>
      <button class="btn-refresh" onclick="loadAll()">↻ Refresh Queue</button>
    </header>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Pending Verification</span>
        <span class="stat-val stat-pending" id="statPending">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Approved & Live</span>
        <span class="stat-val stat-verified" id="statVerified">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Rejected Documents</span>
        <span class="stat-val stat-rejected" id="statRejected">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Neon DB Size</span>
        <span class="stat-val stat-db" id="statDbSize">-</span>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="batch-actions">
        <label class="checkbox-label">
          <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)">
          Select All (<span id="selectedCount">0</span>)
        </label>
        <button class="btn-approve" id="btnBatchApprove" disabled onclick="batchAction('verify')">✓ Approve Selected</button>
        <button class="btn-reject" id="btnBatchReject" disabled onclick="batchAction('reject')">✕ Reject Selected</button>
      </div>
      <input type="text" class="search-filter" id="filterInput" placeholder="Filter candidates..." oninput="filterQueue()">
    </div>

    <!-- Candidates List -->
    <div id="queue" class="queue-list">Loading candidate documents...</div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8000/api/v1/admin';
    let candidatesData = [];
    let selectedIds = new Set();

    async function loadStats() {
      try {
        const res = await fetch(`${API_BASE}/stats`);
        const stats = await res.json();
        document.getElementById('statPending').textContent = stats.pending_candidates;
        document.getElementById('statVerified').textContent = stats.verified_count;
        document.getElementById('statRejected').textContent = stats.rejected_count;
        document.getElementById('statDbSize').textContent = stats.db_size;
      } catch (e) {
        console.error("Stats fetch error:", e);
      }
    }

    async function loadCandidates() {
      const q = document.getElementById('queue');
      try {
        const res = await fetch(`${API_BASE}/candidates`);
        candidatesData = await res.json();
        selectedIds.clear();
        updateSelectedUI();

        if (candidatesData.length === 0) {
          q.innerHTML = `
            <div class="empty-state">
              <div class="empty-title">🎉 Verification Queue Clean!</div>
              <div class="empty-desc">No candidate documents waiting for review. All crawled content has been verified or rejected.</div>
            </div>
          `;
          return;
        }

        renderCandidates(candidatesData);
      } catch (e) {
        q.innerHTML = `<div class="empty-state"><div class="empty-title" style="color:var(--red);">Error Connection Failed</div><div class="empty-desc">${e.message}. Is the backend running?</div></div>`;
      }
    }

    function renderCandidates(list) {
      const q = document.getElementById('queue');
      q.innerHTML = list.map(doc => {
        const isSelected = selectedIds.has(doc.id);
        const faviconUrl = doc.domain ? `https://www.google.com/s2/favicons?domain=${doc.domain}&sz=32` : '';
        const previewText = doc.body ? doc.body.substring(0, 400) : '(No text extracted)';

        return `
          <div class="card ${isSelected ? 'selected' : ''}" id="doc-${doc.id}">
            <div class="card-header">
              <div class="title-area">
                <input type="checkbox" class="card-checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelect('${doc.id}', this.checked)">
                ${faviconUrl ? `<img class="favicon-icon" src="${faviconUrl}" alt="">` : ''}
                <a class="doc-title" href="${doc.url}" target="_blank">${escapeHtml(doc.title)}</a>
              </div>
              <span class="badge badge-kind">${escapeHtml(doc.kind)}</span>
            </div>
            <a class="url-link" href="${doc.url}" target="_blank">${escapeHtml(doc.url)}</a>
            <div class="doc-body">${escapeHtml(previewText)}</div>
            <div class="card-footer">
              <span class="meta-time">Source: ${escapeHtml(doc.source_name)} | Discovered: ${doc.discovered_at ? doc.discovered_at.substring(0, 19) : 'Recently'}</span>
              <div class="card-actions">
                <button class="btn-approve" onclick="verifyDoc('${doc.id}')">✓ Approve</button>
                <button class="btn-reject" onclick="rejectDoc('${doc.id}')">✕ Reject</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function toggleSelect(id, checked) {
      if (checked) selectedIds.add(id);
      else selectedIds.delete(id);
      
      const card = document.getElementById(`doc-${id}`);
      if (card) card.classList.toggle('selected', checked);
      updateSelectedUI();
    }

    function toggleSelectAll(checked) {
      const filterVal = document.getElementById('filterInput').value.toLowerCase();
      const visible = candidatesData.filter(d => 
        d.title.toLowerCase().includes(filterVal) || 
        d.url.toLowerCase().includes(filterVal)
      );

      visible.forEach(d => {
        if (checked) selectedIds.add(d.id);
        else selectedIds.delete(d.id);
      });

      renderCandidates(visible);
      updateSelectedUI();
    }

    function updateSelectedUI() {
      const count = selectedIds.size;
      document.getElementById('selectedCount').textContent = count;
      document.getElementById('btnBatchApprove').disabled = count === 0;
      document.getElementById('btnBatchReject').disabled = count === 0;
      document.getElementById('selectAll').checked = count > 0 && count === candidatesData.length;
    }

    function filterQueue() {
      const filterVal = document.getElementById('filterInput').value.toLowerCase();
      const filtered = candidatesData.filter(d => 
        (d.title && d.title.toLowerCase().includes(filterVal)) || 
        (d.url && d.url.toLowerCase().includes(filterVal)) ||
        (d.body && d.body.toLowerCase().includes(filterVal))
      );
      renderCandidates(filtered);
    }

    async function verifyDoc(id) {
      try {
        await fetch(`${API_BASE}/verify/${id}`, { method: 'POST' });
        removeDocFromUI(id);
        loadStats();
      } catch (e) { alert("Verification failed: " + e.message); }
    }

    async function rejectDoc(id) {
      try {
        await fetch(`${API_BASE}/reject/${id}`, { method: 'POST' });
        removeDocFromUI(id);
        loadStats();
      } catch (e) { alert("Rejection failed: " + e.message); }
    }

    async function batchAction(action) {
      const ids = Array.from(selectedIds);
      if (ids.length === 0) return;

      const endpoint = action === 'verify' ? 'batch_verify' : 'batch_reject';
      try {
        await fetch(`${API_BASE}/${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(ids)
        });
        ids.forEach(id => removeDocFromUI(id));
        selectedIds.clear();
        updateSelectedUI();
        loadStats();
      } catch (e) {
        alert("Batch action failed: " + e.message);
      }
    }

    function removeDocFromUI(id) {
      candidatesData = candidatesData.filter(d => d.id !== id);
      selectedIds.delete(id);
      const card = document.getElementById(`doc-${id}`);
      if (card) card.remove();
      if (candidatesData.length === 0) loadCandidates();
    }

    function loadAll() {
      loadStats();
      loadCandidates();
    }

    loadAll();
  </script>
</body>
</html>
