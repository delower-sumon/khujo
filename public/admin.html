<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khujo Admin — Verification Vault & Curation</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      
      --brand-green: #006a4e;
      --green-text: #059669;
      --green-bg: #ecfdf5;
      --green-border: #a7f3d0;
      
      --red-text: #dc2626;
      --red-bg: #fef2f2;
      --red-border: #fecaca;
      
      --yellow-text: #d97706;
      --yellow-bg: #fffbeb;
      --yellow-border: #fde68a;
      
      --blue-text: #2563eb;
      --blue-bg: #eff6ff;
      --blue-border: #bfdbfe;
      
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -1px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Hind Siliguri', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 20px 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 1040px; margin: 0 auto; }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      width: 40px; height: 40px;
      background: var(--brand-green);
      border-radius: 10px;
      display: grid; place-items: center;
      font-weight: 700; color: white; font-size: 20px;
      box-shadow: 0 2px 8px rgba(0, 106, 78, 0.25);
      flex-shrink: 0;
    }
    h1 { font-size: 19px; font-weight: 700; color: var(--text-main); letter-spacing: -0.02em; }
    .subtitle { font-size: 13px; color: var(--text-muted); font-weight: 400; }

    .btn-refresh {
      background: var(--card-bg);
      color: var(--text-secondary);
      border: 1px solid var(--card-border);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-refresh:hover { background: #f1f5f9; color: var(--text-main); border-color: #cbd5e1; }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .stat-card:hover { border-color: #cbd5e1; transform: translateY(-1px); }
    .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
    .stat-val { font-size: 26px; font-weight: 700; margin-top: 4px; line-height: 1.1; }
    .stat-pending { color: var(--yellow-text); }
    .stat-verified { color: var(--green-text); }
    .stat-rejected { color: var(--red-text); }
    .stat-db { color: var(--blue-text); }

    /* Nav Tabs */
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
    }
    .tab-btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .tab-btn:hover { background: #f1f5f9; color: var(--text-main); }
    .tab-btn.active {
      background: var(--card-bg);
      border-color: var(--card-border);
      color: var(--brand-green);
      box-shadow: var(--shadow-sm);
    }
    .tab-badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #e2e8f0;
      color: var(--text-main);
    }
    .tab-btn.active .tab-badge { background: var(--green-bg); color: var(--green-text); }

    /* Toolbar */
    .toolbar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      flex-wrap: wrap;
      gap: 12px;
    }
    .batch-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    
    button {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    
    .btn-approve { background: var(--brand-green); color: white; box-shadow: 0 1px 2px rgba(0, 106, 78, 0.2); }
    .btn-approve:hover:not(:disabled) { background: #00523d; }
    
    .btn-edit { background: var(--blue-bg); color: var(--blue-text); border: 1px solid var(--blue-border); }
    .btn-edit:hover:not(:disabled) { background: #dbeafe; }

    .btn-reject { background: var(--red-text); color: white; box-shadow: 0 1px 2px rgba(220, 38, 38, 0.2); }
    .btn-reject:hover:not(:disabled) { background: #b91c1c; }

    .btn-restore { background: #f59e0b; color: white; }
    .btn-restore:hover:not(:disabled) { background: #d97706; }

    .checkbox-label {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      font-weight: 500;
    }

    .search-filter {
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      width: 240px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-filter:focus { border-color: var(--brand-green); box-shadow: 0 0 0 3px rgba(0, 106, 78, 0.12); }

    /* Candidate Cards */
    .queue-list { display: flex; flex-direction: column; gap: 14px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover { border-color: #cbd5e1; box-shadow: var(--shadow-md); }
    .card.selected { border-color: var(--brand-green); background: var(--green-bg); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 6px;
    }

    .title-area { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .card-checkbox { width: 17px; height: 17px; cursor: pointer; accent-color: var(--brand-green); flex-shrink: 0; }
    
    .favicon-icon {
      width: 18px; height: 18px;
      border-radius: 4px;
      object-fit: contain;
      background: #f1f5f9;
      flex-shrink: 0;
    }

    .doc-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      text-decoration: none;
      line-height: 1.35;
      word-break: break-word;
    }
    .doc-title:hover { text-decoration: underline; color: var(--brand-green); }

    .badge {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }
    .badge-kind { background: var(--blue-bg); color: var(--blue-text); border: 1px solid var(--blue-border); }

    .url-link {
      font-size: 12px;
      color: #0284c7;
      text-decoration: none;
      word-break: break-all;
      display: inline-block;
      margin-bottom: 10px;
    }
    .url-link:hover { text-decoration: underline; }

    .doc-snippet-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 12px;
    }
    .snippet-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .snippet-text {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      word-break: break-word;
    }

    /* Inline Curation Editor */
    .edit-form {
      display: none;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
      flex-direction: column;
      gap: 10px;
    }
    .edit-form.active { display: flex; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
    .form-input, .form-textarea, .form-select {
      font-family: inherit;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      outline: none;
      background: white;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--brand-green); }
    .form-textarea { resize: vertical; min-height: 60px; }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .meta-time { font-size: 12px; color: var(--text-muted); }
    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
    }
    .empty-title { font-size: 17px; font-weight: 600; margin-bottom: 6px; color: var(--green-text); }
    .empty-desc { font-size: 13px; color: var(--text-muted); }

    /* Responsive Mobile Rules */
    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .search-filter { width: 100%; }
      .batch-actions {
        justify-content: space-between;
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      body { padding: 12px 10px; }
      header { flex-direction: column; align-items: flex-start; }
      .btn-refresh { width: 100%; justify-content: center; }
      .card { padding: 14px; }
      .card-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .card-actions { width: 100%; }
      .card-actions button { flex: 1; text-align: center; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-logo" style="background:transparent;"><img src="/logo.svg" style="height:38px;width:auto;" alt="Khujo Logo"></div>
        <div>
          <h1>Khujo Verification Vault & Curation</h1>
          <div class="subtitle">Human-in-the-Loop Content Gatekeeper & Editor</div>
        </div>
      </div>
      <div style="display: flex; gap: 10px;">
        <a href="/entities.html" class="btn-refresh" style="text-decoration:none; background: var(--green-bg); color: var(--green-text);">
          👤 Switch to Entities
        </a>
        <button class="btn-refresh" onclick="loadAll()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.13 15.57a10 10 0 1 0 3.8-10.45l-5.43 5.43"/></svg>
          Refresh Queue
        </button>
      </div>
    </header>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card" onclick="switchTab('candidate')">
        <span class="stat-label">Pending Review</span>
        <span class="stat-val stat-pending" id="statPending">-</span>
      </div>
      <div class="stat-card" onclick="switchTab('verified')">
        <span class="stat-label">Approved & Live</span>
        <span class="stat-val stat-verified" id="statVerified">-</span>
      </div>
      <div class="stat-card" onclick="switchTab('rejected')">
        <span class="stat-label">Rejected</span>
        <span class="stat-val stat-rejected" id="statRejected">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Neon DB Storage</span>
        <span class="stat-val stat-db" id="statDbSize">-</span>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-candidate" onclick="switchTab('candidate')">
        🟡 Pending Review <span class="tab-badge" id="badgeCandidate">0</span>
      </button>
      <button class="tab-btn" id="tab-verified" onclick="switchTab('verified')">
        🟢 Approved & Live <span class="tab-badge" id="badgeVerified">0</span>
      </button>
      <button class="tab-btn" id="tab-rejected" onclick="switchTab('rejected')">
        🔴 Rejected History <span class="tab-badge" id="badgeRejected">0</span>
      </button>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="batch-actions">
        <label class="checkbox-label">
          <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)">
          Select All (<span id="selectedCount">0</span>)
        </label>
        <button class="btn-approve" id="btnBatchApprove" disabled onclick="batchAction('verify')">✓ Approve Selected</button>
        <button class="btn-reject" id="btnBatchReject" disabled onclick="batchAction('reject')">✕ Reject Selected</button>
      </div>
      <input type="text" class="search-filter" id="filterInput" placeholder="Search documents..." oninput="filterQueue()">
    </div>

    <!-- Candidates List -->
    <div id="queue" class="queue-list">Loading documents...</div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8000/api/v1/admin';
    let currentStatus = 'candidate';
    let documentsData = [];
    let selectedIds = new Set();

    function getAdminKey() {
      let key = localStorage.getItem('khujo_admin_key');
      if (!key) {
        key = prompt("Enter Admin API Key (default: khujo_admin_secret_2026):") || "khujo_admin_secret_2026";
        localStorage.setItem('khujo_admin_key', key);
      }
      return key;
    }

    async function adminFetch(url, options = {}) {
      options.headers = options.headers || {};
      options.headers['X-Admin-Key'] = getAdminKey();
      const res = await fetch(url, options);
      if (res.status === 401) {
        localStorage.removeItem('khujo_admin_key');
        alert("Unauthorized: Invalid Admin Key. Please refresh and re-enter.");
      }
      return res;
    }

    async function loadStats() {
      try {
        const res = await adminFetch(`${API_BASE}/stats`);
        const stats = await res.json();
        document.getElementById('statPending').textContent = stats.pending_candidates;
        document.getElementById('statVerified').textContent = stats.verified_count;
        document.getElementById('statRejected').textContent = stats.rejected_count;
        document.getElementById('statDbSize').textContent = stats.db_size;

        document.getElementById('badgeCandidate').textContent = stats.pending_candidates;
        document.getElementById('badgeVerified').textContent = stats.verified_count;
        document.getElementById('badgeRejected').textContent = stats.rejected_count;
      } catch (e) {
        console.error("Stats fetch error:", e);
      }
    }

    function switchTab(status) {
      currentStatus = status;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${status}`).classList.add('active');
      loadDocuments();
    }

    async function loadDocuments() {
      const q = document.getElementById('queue');
      try {
        const res = await adminFetch(`${API_BASE}/candidates?status=${currentStatus}`);
        documentsData = await res.json();
        selectedIds.clear();
        updateSelectedUI();

        if (documentsData.length === 0) {
          let emptyTitle = "🎉 Queue Clean!";
          let emptyDesc = "No pending candidate documents waiting for review.";
          if (currentStatus === 'verified') {
            emptyTitle = "No Approved Documents Yet";
            emptyDesc = "Approve candidates from the Pending Review tab to make them live on SERP.";
          } else if (currentStatus === 'rejected') {
            emptyTitle = "No Rejected Documents";
            emptyDesc = "Rejected items will appear here for audit or restoration.";
          }

          q.innerHTML = `
            <div class="empty-state">
              <div class="empty-title">${emptyTitle}</div>
              <div class="empty-desc">${emptyDesc}</div>
            </div>
          `;
          return;
        }

        renderDocuments(documentsData);
      } catch (e) {
        q.innerHTML = `<div class="empty-state"><div class="empty-title" style="color:var(--red-text);">Connection Failed</div><div class="empty-desc">${e.message}. Is backend running on port 8000?</div></div>`;
      }
    }

    function renderDocuments(list) {
      const q = document.getElementById('queue');
      q.innerHTML = list.map(doc => {
        const isSelected = selectedIds.has(doc.id);
        const faviconUrl = doc.domain ? `https://www.google.com/s2/favicons?domain=${doc.domain}&sz=32` : '';
        const decodedUrl = safeDecodeUri(doc.url);
        const snippetText = doc.description || (doc.body ? doc.body.substring(0, 300) : '(No description extracted)');

        return `
          <div class="card ${isSelected ? 'selected' : ''}" id="doc-${doc.id}">
            <div class="card-header">
              <div class="title-area">
                <input type="checkbox" class="card-checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelect('${doc.id}', this.checked)">
                ${faviconUrl ? `<img class="favicon-icon" src="${faviconUrl}" alt="">` : ''}
                <a class="doc-title" id="title-text-${doc.id}" href="${doc.url}" target="_blank">${escapeHtml(doc.title)}</a>
              </div>
              <span class="badge badge-kind" id="kind-badge-${doc.id}">${escapeHtml(doc.kind)}</span>
            </div>
            <a class="url-link" href="${doc.url}" target="_blank">${escapeHtml(decodedUrl)}</a>
            
            <div class="doc-snippet-box">
              <div class="snippet-title">SERP Snippet Preview</div>
              <div class="snippet-text" id="desc-text-${doc.id}">${escapeHtml(snippetText)}</div>
            </div>

            <!-- Inline Curation Form -->
            <div class="edit-form" id="edit-form-${doc.id}">
              <div class="form-group">
                <label class="form-label">Edit Title:</label>
                <input type="text" class="form-input" id="edit-title-${doc.id}" value="${escapeHtml(doc.title)}">
              </div>
              <div class="form-group">
                <label class="form-label">Edit SERP Snippet / Description:</label>
                <textarea class="form-textarea" id="edit-desc-${doc.id}">${escapeHtml(doc.description || snippetText)}</textarea>
              </div>
              <div class="form-group">
                <label class="form-label">Document Kind:</label>
                <select class="form-select" id="edit-kind-${doc.id}">
                  <option value="news" ${doc.kind === 'news' ? 'selected' : ''}>News</option>
                  <option value="article" ${doc.kind === 'article' ? 'selected' : ''}>Article</option>
                  <option value="government" ${doc.kind === 'government' ? 'selected' : ''}>Government</option>
                  <option value="wiki" ${doc.kind === 'wiki' ? 'selected' : ''}>Wiki / Knowledge</option>
                  <option value="listing" ${doc.kind === 'listing' ? 'selected' : ''}>Listing / Directory</option>
                </select>
              </div>
              <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:4px;">
                <button class="btn-approve" onclick="saveAndApprove('${doc.id}')">💾 Save & Approve Live</button>
                <button class="btn-edit" onclick="toggleEdit('${doc.id}')">Cancel</button>
              </div>
            </div>

            <div class="card-footer">
              <span class="meta-time">Source: <strong>${escapeHtml(doc.source_name)}</strong> | Discovered: ${doc.discovered_at ? doc.discovered_at.substring(0, 19) : 'Recently'}</span>
              <div class="card-actions">
                ${currentStatus === 'candidate' ? `
                  <button class="btn-approve" onclick="verifyDoc('${doc.id}')">✓ Approve</button>
                  <button class="btn-edit" onclick="toggleEdit('${doc.id}')">✏️ Edit & Curate</button>
                  <button class="btn-reject" onclick="rejectDoc('${doc.id}')">✕ Reject</button>
                ` : ''}
                ${currentStatus === 'verified' ? `
                  <button class="btn-edit" onclick="toggleEdit('${doc.id}')">✏️ Edit Live SERP Snippet</button>
                  <button class="btn-reject" onclick="rejectDoc('${doc.id}')">🗑 Revoke (Reject)</button>
                ` : ''}
                ${currentStatus === 'rejected' ? `
                  <button class="btn-restore" onclick="restoreDoc('${doc.id}')">↺ Restore to Pending</button>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleEdit(id) {
      const form = document.getElementById(`edit-form-${id}`);
      if (form) form.classList.toggle('active');
    }

    async function saveAndApprove(id) {
      const title = document.getElementById(`edit-title-${id}`).value;
      const description = document.getElementById(`edit-desc-${id}`).value;
      const kind = document.getElementById(`edit-kind-${id}`).value;

      try {
        // 1. Update Document details
        await adminFetch(`${API_BASE}/document/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, description, kind, state: 'verified' })
        });

        // 2. Refresh UI
        removeDocFromUI(id);
        loadStats();
      } catch (e) {
        alert("Curation failed: " + e.message);
      }
    }

    function safeDecodeUri(url) {
      try { return decodeURIComponent(url); }
      catch (e) { return url; }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function toggleSelect(id, checked) {
      if (checked) selectedIds.add(id);
      else selectedIds.delete(id);
      
      const card = document.getElementById(`doc-${id}`);
      if (card) card.classList.toggle('selected', checked);
      updateSelectedUI();
    }

    function toggleSelectAll(checked) {
      const filterVal = document.getElementById('filterInput').value.toLowerCase();
      const visible = documentsData.filter(d => 
        (d.title && d.title.toLowerCase().includes(filterVal)) || 
        (d.url && d.url.toLowerCase().includes(filterVal))
      );

      visible.forEach(d => {
        if (checked) selectedIds.add(d.id);
        else selectedIds.delete(d.id);
      });

      renderDocuments(visible);
      updateSelectedUI();
    }

    function updateSelectedUI() {
      const count = selectedIds.size;
      document.getElementById('selectedCount').textContent = count;
      document.getElementById('btnBatchApprove').disabled = count === 0;
      document.getElementById('btnBatchReject').disabled = count === 0;
      document.getElementById('selectAll').checked = count > 0 && count === documentsData.length;
    }

    function filterQueue() {
      const filterVal = document.getElementById('filterInput').value.toLowerCase();
      const filtered = documentsData.filter(d => 
        (d.title && d.title.toLowerCase().includes(filterVal)) || 
        (d.url && d.url.toLowerCase().includes(filterVal)) ||
        (d.body && d.body.toLowerCase().includes(filterVal)) ||
        (d.description && d.description.toLowerCase().includes(filterVal))
      );
      renderDocuments(filtered);
    }

    async function verifyDoc(id) {
      try {
        await adminFetch(`${API_BASE}/verify/${id}`, { method: 'POST' });
        removeDocFromUI(id);
        loadStats();
      } catch (e) { alert("Verification failed: " + e.message); }
    }

    async function rejectDoc(id) {
      try {
        await adminFetch(`${API_BASE}/reject/${id}`, { method: 'POST' });
        removeDocFromUI(id);
        loadStats();
      } catch (e) { alert("Rejection failed: " + e.message); }
    }

    async function restoreDoc(id) {
      try {
        await adminFetch(`${API_BASE}/restore/${id}`, { method: 'POST' });
        removeDocFromUI(id);
        loadStats();
      } catch (e) { alert("Restoration failed: " + e.message); }
    }

    async function batchAction(action) {
      const ids = Array.from(selectedIds);
      if (ids.length === 0) return;

      const endpoint = action === 'verify' ? 'batch_verify' : 'batch_reject';
      try {
        await adminFetch(`${API_BASE}/${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(ids)
        });
        ids.forEach(id => removeDocFromUI(id));
        selectedIds.clear();
        updateSelectedUI();
        loadStats();
      } catch (e) {
        alert("Batch action failed: " + e.message);
      }
    }

    function removeDocFromUI(id) {
      documentsData = documentsData.filter(d => d.id !== id);
      selectedIds.delete(id);
      const card = document.getElementById(`doc-${id}`);
      if (card) card.remove();
      if (documentsData.length === 0) loadDocuments();
    }

    function loadAll() {
      loadStats();
      loadDocuments();
    }

    loadAll();
  </script>
</body>
</html>
