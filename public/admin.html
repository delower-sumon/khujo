<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khujo Admin — Data Verification Queue</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      
      --brand-green: #006a4e;
      --green-text: #059669;
      --green-bg: #ecfdf5;
      --green-border: #a7f3d0;
      
      --red-text: #dc2626;
      --red-bg: #fef2f2;
      --red-border: #fecaca;
      
      --yellow-text: #d97706;
      --yellow-bg: #fffbeb;
      --yellow-border: #fde68a;
      
      --blue-text: #2563eb;
      --blue-bg: #eff6ff;
      --blue-border: #bfdbfe;
      
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -1px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Hind Siliguri', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 20px 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 1040px; margin: 0 auto; }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      width: 40px; height: 40px;
      background: var(--brand-green);
      border-radius: 10px;
      display: grid; place-items: center;
      font-weight: 700; color: white; font-size: 20px;
      box-shadow: 0 2px 8px rgba(0, 106, 78, 0.25);
      flex-shrink: 0;
    }
    h1 { font-size: 19px; font-weight: 700; color: var(--text-main); letter-spacing: -0.02em; }
    .subtitle { font-size: 13px; color: var(--text-muted); font-weight: 400; }

    .btn-refresh {
      background: var(--card-bg);
      color: var(--text-secondary);
      border: 1px solid var(--card-border);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-refresh:hover { background: #f1f5f9; color: var(--text-main); border-color: #cbd5e1; }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
    }
    .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
    .stat-val { font-size: 26px; font-weight: 700; margin-top: 4px; line-height: 1.1; }
    .stat-pending { color: var(--yellow-text); }
    .stat-verified { color: var(--green-text); }
    .stat-rejected { color: var(--red-text); }
    .stat-db { color: var(--blue-text); }

    /* Toolbar */
    .toolbar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      flex-wrap: wrap;
      gap: 12px;
    }
    .batch-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    
    button {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    
    .btn-approve { background: var(--brand-green); color: white; box-shadow: 0 1px 2px rgba(0, 106, 78, 0.2); }
    .btn-approve:hover:not(:disabled) { background: #00523d; }
    
    .btn-reject { background: var(--red-text); color: white; box-shadow: 0 1px 2px rgba(220, 38, 38, 0.2); }
    .btn-reject:hover:not(:disabled) { background: #b91c1c; }

    .checkbox-label {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      font-weight: 500;
    }

    .search-filter {
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      width: 240px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-filter:focus { border-color: var(--brand-green); box-shadow: 0 0 0 3px rgba(0, 106, 78, 0.12); }

    /* Candidate Cards */
    .queue-list { display: flex; flex-direction: column; gap: 14px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover { border-color: #cbd5e1; box-shadow: var(--shadow-md); }
    .card.selected { border-color: var(--brand-green); background: var(--green-bg); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 6px;
    }

    .title-area { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .card-checkbox { width: 17px; height: 17px; cursor: pointer; accent-color: var(--brand-green); flex-shrink: 0; }
    
    .favicon-icon {
      width: 18px; height: 18px;
      border-radius: 4px;
      object-fit: contain;
      background: #f1f5f9;
      flex-shrink: 0;
    }

    .doc-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      text-decoration: none;
      line-height: 1.35;
      word-break: break-word;
    }
    .doc-title:hover { text-decoration: underline; color: var(--brand-green); }

    .badge {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }
    .badge-kind { background: var(--blue-bg); color: var(--blue-text); border: 1px solid var(--blue-border); }

    .url-link {
      font-size: 12px;
      color: #0284c7;
      text-decoration: none;
      word-break: break-all;
      display: inline-block;
      margin-bottom: 10px;
    }
    .url-link:hover { text-decoration: underline; }

    .doc-body {
      font-size: 13px;
      color: var(--text-secondary);
      background: #f8fafc;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 130px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
      font-family: inherit;
      line-height: 1.6;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .meta-time { font-size: 12px; color: var(--text-muted); }

    .card-actions { display: flex; gap: 8px; }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
    }
    .empty-title { font-size: 17px; font-weight: 600; margin-bottom: 6px; color: var(--green-text); }
    .empty-desc { font-size: 13px; color: var(--text-muted); }

    /* Responsive Mobile Rules */
    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .search-filter { width: 100%; }
      .batch-actions {
        justify-content: space-between;
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      body { padding: 12px 10px; }
      header { flex-direction: column; align-items: flex-start; }
      .btn-refresh { width: 100%; justify-content: center; }
      .card { padding: 14px; }
      .card-footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .card-actions { width: 100%; }
      .card-actions button { flex: 1; text-align: center; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-logo">K</div>
        <div>
          <h1>Khujo Verification Vault</h1>
          <div class="subtitle">Human-in-the-Loop Content Gatekeeper</div>
        </div>
      </div>
      <button class="btn-refresh" onclick="loadAll()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.13 15.57a10 10 0 1 0 3.8-10.45l-5.43 5.43"/></svg>
        Refresh Queue
      </button>
    </header>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Pending Review</span>
        <span class="stat-val stat-pending" id="statPending">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Approved & Live</span>
        <span class="stat-val stat-verified" id="statVerified">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Rejected</span>
        <span class="stat-val stat-rejected" id="statRejected">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Neon DB Storage</span>
        <span class="stat-val stat-db" id="statDbSize">-</span>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="batch-actions">
        <label class="checkbox-label">
          <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)">
          Select All (<span id="selectedCount">0</span>)
        </label>
        <button class="btn-approve" id="btnBatchApprove" disabled onclick="batchAction('verify')">✓ Approve Selected</button>
        <button class="btn-reject" id="btnBatchReject" disabled onclick="batchAction('reject')">✕ Reject Selected</button>
      </div>
      <input type="text" class="search-filter" id="filterInput" placeholder="Search candidates..." oninput="filterQueue()">
    </div>

    <!-- Candidates List -->
    <div id="queue" class="queue-list">Loading candidate documents...</div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8000/api/v1/admin';
    let candidatesData = [];
    let selectedIds = new Set();

    async function loadStats() {
      try {
        const res = await fetch(`${API_BASE}/stats`);
        const stats = await res.json();
        document.getElementById('statPending').textContent = stats.pending_candidates;
        document.getElementById('statVerified').textContent = stats.verified_count;
        document.getElementById('statRejected').textContent = stats.rejected_count;
        document.getElementById('statDbSize').textContent = stats.db_size;
      } catch (e) {
        console.error("Stats fetch error:", e);
      }
    }

    async function loadCandidates() {
      const q = document.getElementById('queue');
      try {
        const res = await fetch(`${API_BASE}/candidates`);
        candidatesData = await res.json();
        selectedIds.clear();
        updateSelectedUI();

        if (candidatesData.length === 0) {
          q.innerHTML = `
            <div class="empty-state">
              <div class="empty-title">🎉 Verification Queue Clean!</div>
              <div class="empty-desc">No candidate documents waiting for review. All crawled content has been verified or rejected.</div>
            </div>
          `;
          return;
        }

        renderCandidates(candidatesData);
      } catch (e) {
        q.innerHTML = `<div class="empty-state"><div class="empty-title" style="color:var(--red-text);">Connection Failed</div><div class="empty-desc">${e.message}. Is backend running on port 8000?</div></div>`;
      }
    }

    function renderCandidates(list) {
      const q = document.getElementById('queue');
      q.innerHTML = list.map(doc => {
        const isSelected = selectedIds.has(doc.id);
        const faviconUrl = doc.domain ? `https://www.google.com/s2/favicons?domain=${doc.domain}&sz=32` : '';
        const previewText = doc.body ? doc.body.substring(0, 450) : '(No text extracted)';

        return `
          <div class="card ${isSelected ? 'selected' : ''}" id="doc-${doc.id}">
            <div class="card-header">
              <div class="title-area">
                <input type="checkbox" class="card-checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelect('${doc.id}', this.checked)">
                ${faviconUrl ? `<img class="favicon-icon" src="${faviconUrl}" alt="">` : ''}
                <a class="doc-title" href="${doc.url}" target="_blank">${escapeHtml(doc.title)}</a>
              </div>
              <span class="badge badge-kind">${escapeHtml(doc.kind)}</span>
            </div>
            <a class="url-link" href="${doc.url}" target="_blank">${escapeHtml(doc.url)}</a>
            <div class="doc-body">${escapeHtml(previewText)}</div>
            <div class="card-footer">
              <span class="meta-time">Source: <strong>${escapeHtml(doc.source_name)}</strong> | Discovered: ${doc.discovered_at ? doc.discovered_at.substring(0, 19) : 'Recently'}</span>
              <div class="card-actions">
                <button class="btn-approve" onclick="verifyDoc('${doc.id}')">✓ Approve</button>
                <button class="btn-reject" onclick="rejectDoc('${doc.id}')">✕ Reject</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function toggleSelect(id, checked) {
      if (checked) selectedIds.add(id);
      else selectedIds.delete(id);
      
      const card = document.getElementById(`doc-${id}`);
      if (card) card.classList.toggle('selected', checked);
      updateSelectedUI();
    }

    function toggleSelectAll(checked) {
      const filterVal = document.getElementById('filterInput').value.toLowerCase();
      const visible = candidatesData.filter(d => 
        (d.title && d.title.toLowerCase().includes(filterVal)) || 
        (d.url && d.url.toLowerCase().includes(filterVal))
      );

      visible.forEach(d => {
        if (checked) selectedIds.add(d.id);
        else selectedIds.delete(d.id);
      });

      renderCandidates(visible);
      updateSelectedUI();
    }

    function updateSelectedUI() {
      const count = selectedIds.size;
      document.getElementById('selectedCount').textContent = count;
      document.getElementById('btnBatchApprove').disabled = count === 0;
      document.getElementById('btnBatchReject').disabled = count === 0;
      document.getElementById('selectAll').checked = count > 0 && count === candidatesData.length;
    }

    function filterQueue() {
      const filterVal = document.getElementById('filterInput').value.toLowerCase();
      const filtered = candidatesData.filter(d => 
        (d.title && d.title.toLowerCase().includes(filterVal)) || 
        (d.url && d.url.toLowerCase().includes(filterVal)) ||
        (d.body && d.body.toLowerCase().includes(filterVal))
      );
      renderCandidates(filtered);
    }

    async function verifyDoc(id) {
      try {
        await fetch(`${API_BASE}/verify/${id}`, { method: 'POST' });
        removeDocFromUI(id);
        loadStats();
      } catch (e) { alert("Verification failed: " + e.message); }
    }

    async function rejectDoc(id) {
      try {
        await fetch(`${API_BASE}/reject/${id}`, { method: 'POST' });
        removeDocFromUI(id);
        loadStats();
      } catch (e) { alert("Rejection failed: " + e.message); }
    }

    async function batchAction(action) {
      const ids = Array.from(selectedIds);
      if (ids.length === 0) return;

      const endpoint = action === 'verify' ? 'batch_verify' : 'batch_reject';
      try {
        await fetch(`${API_BASE}/${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(ids)
        });
        ids.forEach(id => removeDocFromUI(id));
        selectedIds.clear();
        updateSelectedUI();
        loadStats();
      } catch (e) {
        alert("Batch action failed: " + e.message);
      }
    }

    function removeDocFromUI(id) {
      candidatesData = candidatesData.filter(d => d.id !== id);
      selectedIds.delete(id);
      const card = document.getElementById(`doc-${id}`);
      if (card) card.remove();
      if (candidatesData.length === 0) loadCandidates();
    }

    function loadAll() {
      loadStats();
      loadCandidates();
    }

    loadAll();
  </script>
</body>
</html>
