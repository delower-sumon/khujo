# Nginx configuration for Khujo
# Static UI served from public/  —  No Node runtime in the serving path
# Replace /path/to/your/project with the actual absolute path on your server

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Ensure Bangla text is always served as UTF-8
    charset utf-8;
    charset_types text/html text/plain text/css application/javascript application/json;

    # Gzip for text assets
    gzip on;
    gzip_types text/html text/css application/javascript application/json text/plain;
    gzip_min_length 1024;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=static:10m rate=100r/s;

    server {
        listen 80;
        server_name khujo.com.bd www.khujo.com.bd localhost;

        # ── Static files from public/ ────────────────────────────
        root /path/to/your/project/public;  # <-- update this path

        # HTML files: never cache (always fresh)
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
            limit_req zone=static burst=20 nodelay;
        }

        # CSS and JS: long-lived cache (update filenames to bust)
        location ~* \.(css|js)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
            limit_req zone=static burst=50 nodelay;
        }

        # Favicon and other static assets
        location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff2|woff)$ {
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        # Root — serve index.html
        location = / {
            try_files /index.html =404;
            add_header Cache-Control "no-cache";
            limit_req zone=static burst=20 nodelay;
        }

        # /search route — serve search.html (no redirect, clean URL)
        location = /search {
            try_files /search.html =404;
            add_header Cache-Control "no-cache";
            limit_req zone=static burst=20 nodelay;
        }

        # ── API proxy to FastAPI backend ─────────────────────────
        location /api/ {
            proxy_pass http://localhost:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Rate limit API
            limit_req zone=api burst=5 nodelay;
        }

        # FastAPI docs (dev only — remove in production)
        location /docs {
            proxy_pass http://localhost:8000/docs;
            proxy_set_header Host $host;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}