<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>khujo Architecture</title>
  <style>
    :root {
      --bg-color: #e6e6e2;
      --card-bg: #f5f5f0;
      --text-main: #171717;
      --text-muted: #737373;
      --border-color: #d4d4d0;
      --bubble-bg: #1c1917;
      --bubble-text: #f5f5f4;
      --node-color: #262626;
      --node-dim: rgba(38, 38, 38, 0.15);
      --link-color: rgba(60, 60, 60, 0.2);
    }

    body.dark-theme {
      --bg-color: #0c0a09;
      --card-bg: #1c1917;
      --text-main: #f5f5f4;
      --text-muted: #a8a29e;
      --border-color: #292524;
      --bubble-bg: #292524;
      --bubble-text: #fafaf9;
      --node-color: #e7e5e4;
      --node-dim: rgba(231, 229, 228, 0.15);
      --link-color: rgba(255, 255, 255, 0.2);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    #2d-graph {
      width: 100vw;
      height: 100vh;
    }

    /* Top Left Header */
    .brand-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 8px 18px;
      border-radius: 9999px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    .brand-title {
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.03em;
      color: var(--text-main);
    }

    /* Top Search Button & Modal */
    .search-btn {
      position: absolute;
      top: 20px;
      left: 130px;
      z-index: 10;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s ease;
    }
    .search-btn:hover { transform: scale(1.05); }

    .search-modal {
      position: absolute;
      top: 20px;
      left: 180px;
      z-index: 20;
      display: none;
    }
    .search-modal.active { display: block; }
    .search-input {
      width: 280px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      outline: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    /* Theme Toggle */
    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    /* Side Panel */
    .side-panel {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 440px;
      background: var(--card-bg);
      border-left: 1px solid var(--border-color);
      z-index: 100;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.08);
    }
    .side-panel.open { transform: translateX(0); }

    .panel-header {
      padding: 24px 28px 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .panel-meta {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 24px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }
    .close-btn:hover { color: var(--text-main); }

    .panel-body {
      padding: 0 28px 24px 28px;
      overflow-y: auto;
      flex-grow: 1;
    }

    .panel-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 4px 0 16px 0;
      color: var(--text-main);
      line-height: 1.1;
      word-break: break-word;
    }

    .panel-summary {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-main);
      margin-bottom: 24px;
    }

    .quote-bubble {
      background: var(--bubble-bg);
      color: var(--bubble-text);
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.55;
      margin-bottom: 24px;
      font-weight: 500;
    }
    .quote-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #a8a29e;
      margin-bottom: 6px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin: 20px 0 8px 0;
    }

    .avoid-box {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .pills-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }
    .pill {
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    body.dark-theme .pill { background: rgba(255, 255, 255, 0.06); }
    .pill:hover {
      background: var(--text-main);
      color: var(--bg-color);
    }

    .details-text {
      font-size: 13px;
      line-height: 1.65;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    .panel-footer {
      padding: 16px 28px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
    }
    .nav-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-btn:hover {
      background: var(--text-main);
      color: var(--bg-color);
    }
  </style>

    let currentIndex = 0;

    let highlightNodes = new Set();

    const neighbors = {};

      neighbors[s] && neighbors[s].add(t);
      neighbors[t] && neighbors[t].add(s);
    });

    rawData.nodes.forEach((node, i) => {
      node.defaultSortIndex = i;
    });

    const Graph = ForceGraph3D()(document.getElementById('2d-graph'))
      .graphData(rawData)
      .backgroundColor(document.body.classList.contains('dark-theme') ? '#0c0a09' : '#e6e6e2')
      .nodeId('id')
      .linkDirectionalParticles(link => highlightLinks.has(link) ? 4 : 2)
      .linkDirectionalParticleWidth(link => highlightLinks.has(link) ? 3 : 1.5)
      .linkDirectionalParticleSpeed(link => highlightLinks.has(link) ? 0.008 : 0.002)
      .linkDirectionalParticleColor(link => highlightLinks.has(link) ? '#404040' : '#888888')
      .nodeThreeObject(node => {
        const isSelected = selectedNode && selectedNode.id === node.id;
        const isHovered = hoveredNode && hoveredNode.id === node.id;
        const isHighlighted = highlightNodes.has(node.id);
        
        const group = new THREE.Group();
        
        const radius = Math.max(5.5, (node.val || 6) * 1.15);
        const geometry = new THREE.SphereGeometry(radius, 32, 32);
        
        let color = '#262626';
        let opacity = 0.85;
        
        if (selectedNode || hoveredNode) {
          if (isSelected || isHovered) {
            color = '#000000';
            opacity = 1.0;
          } else if (isHighlighted) {
            color = '#404040';
            opacity = 0.95;
          } else {
            color = '#a3a3a3';
            opacity = 0.12;
          }
        }
        
        const material = new THREE.MeshBasicMaterial({ color, transparent: true, opacity });
        const sphere = new THREE.Mesh(geometry, material);
        group.add(sphere);
        
        if (!selectedNode && !hoveredNode || isSelected || isHighlighted) {
          const sprite = new SpriteText(node.name.toUpperCase());
          sprite.color = (isSelected || isHovered) ? '#000000' : (isHighlighted ? '#404040' : '#888888');
          sprite.textHeight = (isSelected || isHovered) ? 10 : 7;
          sprite.position.y = - (radius + sprite.textHeight * 0.8);
          group.add(sprite);
        }
        
        return group;
      })
      .linkColor(link => {
        if (!selectedNode && !hoveredNode) return 'rgba(60, 60, 60, 0.15)';

      })
      .linkWidth(link => highlightLinks.has(link) ? 1.8 : 0.8)
      .onNodeHover(node => {
        hoveredNode = node;
        if (!selectedNode) {
          highlightNodes.clear();
          highlightLinks.clear();
          if (node) {
            highlightNodes.add(node.id);
            if (neighbors[node.id]) {
              neighbors[node.id].forEach(nId => highlightNodes.add(nId));
            }
            rawData.links.forEach(link => {
              const s = typeof link.source === 'object' ? link.source.id : link.source;

        }

      .d3AlphaDecay(0); // Keep simulation running subtly forever

    // Zoom out base view slightly on load
    setTimeout(() => {

    // Configure Custom Solar / Orbital Force
    Graph.d3Force('charge').strength(-15);
    Graph.d3Force('link').distance(40);
    Graph.d3Force('solar', (alpha) => {
      // Cap the alpha value to prevent chaotic jitter when d3AlphaDecay is 0
      const a = Math.min(alpha, 0.1); 
      const INNER_R = 80;
      const DEFAULT_R = 140;

      rawData.nodes.forEach((n, i) => {
        if (!n.z) n.z = (Math.random() - 0.5) * 100;
        if (!n.vz) n.vz = 0;

        const isSelected = selectedNode && selectedNode.id === n.id;
        const isConnected = selectedNode && neighbors[selectedNode.id] && neighbors[selectedNode.id].has(n.id);

        if (isSelected || isConnected) {
          // Foreground cluster centered at (0, 0, 200)
          const centerX = 0, centerY = 0, centerZ = 200;

          if (isSelected) {
            n.vx -= (n.x - centerX) * a * 1.5; // pull strongly to center of foreground
            n.vy -= (n.y - centerY) * a * 1.5;
            n.vz -= (n.z - centerZ) * a * 1.5;
            return;
          }
          
          const dx = n.x - centerX;
          const dy = n.y - centerY;
          const dz = n.z - centerZ;
          const dist = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;
          
          // push towards INNER_R orbit around foreground center
          const force = (dist - INNER_R) * a * 0.2;
          n.vx -= (dx / dist) * force;

          const targetX = DEFAULT_R * Math.cos(theta) * Math.sin(phi);

          const dx = n.x - targetX;
          const dy = n.y - targetY;

          n.vx -= dx * a * 0.15;
          n.vy -= dy * a * 0.15;

          const dist = Math.sqrt(n.x*n.x + n.y*n.y + n.z*n.z) || 1;

          n.vy -= (n.x / dist) * a * 0.005;
          n.vz += (n.x / dist) * a * 0.001;

    });

    function selectNode(node) {
      selectedNode = node;
      const index = rawData.nodes.findIndex(n => n.id === node.id);
      if (index !== -1) currentIndex = index;

      history.pushState(null, '', `?term=${encodeURIComponent(node.name.toLowerCase())}`);

      highlightLinks.clear();

      // Fixed concentric layout handled fluidly by the custom 'solar' force
      
      Graph.d3ReheatSimulation();

      Graph.cameraPosition({ x: 0, y: 0, z: 450 }, { x: 0, y: 0, z: 200 }, 2000);

      document.getElementById('pTitle').innerText = node.name;

      document.getElementById('pProtip').innerText = node.protip;
      document.getElementById('pAvoid').innerText = node.avoid;
      document.getElementById('pDetails').innerText = node.details;
      document.getElementById('pIndex').innerText = `${currentIndex + 1} / ${rawData.nodes.length}`;

      // Build connected pills
      const connected = rawData.links.filter(l => {
        const s = typeof l.source === 'object' ? l.source.id : l.source;
        const t = typeof l.target === 'object' ? l.target.id : l.target;
        return s === node.id || t === node.id;
      });

      const pillsHtml = connected.map(l => {
        const s = typeof l.source === 'object' ? l.source.id : l.source;
        const t = typeof l.target === 'object' ? l.target.id : l.target;
        const targetId = s === node.id ? t : s;
        const targetNode = rawData.nodes.find(n => n.id === targetId);
        return targetNode ? `<div class="pill" onclick="selectById('${targetNode.id}')">${targetNode.name}</div>` : '';

      document.getElementById('pPills').innerHTML = pillsHtml || '<div style="font-size:12px; color:var(--text-muted)">Isolated component</div>';
      document.getElementById('sidePanel').classList.add('open');
    }

    function selectById(id) {
      const target = rawData.nodes.find(n => n.id === id);
      if (target) selectNode(target);
    }

    function resetSelection() {
      selectedNode = null;
      highlightNodes.clear();
      highlightLinks.clear();
      history.pushState(null, '', window.location.pathname);
      closePanel();
      
      // Simulation handles layout transition back to default circle
      Graph.d3ReheatSimulation();

    }

    function closePanel() {
      document.getElementById('sidePanel').classList.remove('open');
      selectedNode = null;
      highlightNodes.clear();
      highlightLinks.clear();
    }

    function navigateNode(dir) {
      currentIndex = (currentIndex + dir + rawData.nodes.length) % rawData.nodes.length;
      selectNode(rawData.nodes[currentIndex]);
    }

    function toggleSearch() {
      const m = document.getElementById('searchModal');
      m.classList.toggle('active');
      if (m.classList.contains('active')) document.getElementById('searchInput').focus();
    }

    function onSearch(q) {
      if (!q.trim()) return;
      const target = rawData.nodes.find(n => n.name.toLowerCase().includes(q.toLowerCase()));
      if (target) selectNode(target);
    }

    function toggleTheme() {
      document.body.classList.toggle('dark-theme');
      const isDarkNow = document.body.classList.contains('dark-theme');
      Graph.backgroundColor(isDarkNow ? '#0c0a09' : '#e6e6e2');

    // Process URL Parameters on load

      const urlParams = new URLSearchParams(window.location.search);
      const term = urlParams.get('term');
      if (term) {
        const target = rawData.nodes.find(n => n.name.toLowerCase() === term.toLowerCase());
        if (target) setTimeout(() => selectNode(target), 500);
      }
    });
